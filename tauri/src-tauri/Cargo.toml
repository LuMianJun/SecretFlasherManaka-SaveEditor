[package]
name = "secretflashermanaka-save-editor"
version = "0.3.1"
description = "SecretFlasherManaka lossless offline save editor"
edition = "2021"
default-run = "SecretFlasherManakaSaveEditor"

[[bin]]
name = "SecretFlasherManakaSaveEditor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
rfd = { version = "0.15", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
